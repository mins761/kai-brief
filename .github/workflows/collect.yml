name: Collect News

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install collector dependencies
        run: pip install feedparser requests supabase python-dotenv

      - name: Validate required secrets
        run: |
          python -c "import os, sys; missing=[name for name in ('OPENROUTER_API_KEY','SUPABASE_URL','SUPABASE_KEY') if not os.getenv(name)]; print('Missing required secrets: ' + ', '.join(missing)) if missing else print('Required secrets are configured.'); sys.exit(1 if missing else 0)"

      - name: Run collector
        run: python scripts/collect.py
